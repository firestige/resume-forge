name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Build Resumes"]
    branches: [main]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'reports/**'
      - 'jobs/**/analysis.yaml'
      - 'jobs/**/status.yaml'
      - 'jobs/**/interviews/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 仅当上游工作流成功，或由 push/手动触发时运行
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            texlive-xetex texlive-fonts-extra texlive-latex-extra \
            texlive-lang-chinese fonts-noto-cjk

      - name: Build all resume PDFs
        run: python scripts/build.py --all || python scripts/build.py --full

      - name: Generate insights (fresh, no repo write-back)
        run: python scripts/insights.py

      - name: Generate static site (includes PDF copy)
        run: python scripts/report.py --output output/site/

      - uses: actions/configure-pages@v4
        with:
          # 首次运行时自动启用 Pages（source = GitHub Actions），避免新仓库需手动开启
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
