name: Weekly Report

on:
  schedule:
    - cron: '0 1 * * 1'   # 每周一 09:00 CST (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate weekly insights
        run: python scripts/insights.py --weekly

      - name: Generate weekly report
        run: python scripts/report.py --weekly --output output/site/

      - name: Commit weekly report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          WEEK=$(date +%Y-W%V)
          git add -f output/site/weekly/
          git diff --cached --quiet || \
            git commit -m "chore: weekly report $WEEK [skip ci]"
          git push
